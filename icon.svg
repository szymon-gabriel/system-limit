<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Tło ikony -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2a0812"/>
      <stop offset="60%" stop-color="#0c0307"/>
      <stop offset="100%" stop-color="#040103"/>
    </radialGradient>

    <!-- Neonowy gradient dla logo -->
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a55"/>
      <stop offset="50%" stop-color="#ff1a43"/>
      <stop offset="100%" stop-color="#a00020"/>
    </linearGradient>

    <!-- Poświata (Glow Effect) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Szklana ramka (Glassmorphism) -->
    <linearGradient id="borderGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.25)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGlass)" stroke-width="4"/>

  <!-- Tło z delikatną dodatkową poświatą pod logo -->
  <circle cx="256" cy="240" r="120" fill="#ff1a43" opacity="0.15" filter="blur(40px)"/>

  <!-- Geometric Monogram Logo (A) -->
  <g filter="url(#glow)">
    <!-- Główna zewnętrzna struktura litery A -->
    <path d="M 256 80 
             L 395 410 
             L 330 410 
             L 256 225 
             L 182 410 
             L 117 410 
             Z" 
          fill="url(#neonRed)"/>
    
    <!-- Wewnętrzny detal / V-geometry -->
    <path d="M 256 160
             L 295 270
             L 275 270
             L 256 215
             L 237 270
             L 217 270
             Z" 
          fill="url(#neonRed)"/>

    <!-- Dolna środkowa igła / sztylet -->
    <polygon points="256,290 272,340 256,380 240,340" fill="url(#neonRed)"/>
  </g>
</svg>
